name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn clean package --file pom.xml

      - name: Run tests
        run: mvn test --file pom.xml

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-feishu
          path: target/keycloak-feishu.jar
          retention-days: 7

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Validate tag format to prevent injection
            case "${INPUT_TAG}" in
              v*) printf 'ref_name=%s
' "${INPUT_TAG}" >> "$GITHUB_OUTPUT" ;;
              *)  echo "Invalid tag format: must start with 'v'"; exit 1 ;;
            esac
          else
            printf 'ref_name=%s
' "${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: keycloak-feishu

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: keycloak-feishu.jar
          generate_release_notes: true
          name: Release ${{ steps.tag.outputs.ref_name }}
          tag_name: ${{ steps.tag.outputs.ref_name }}
          draft: false
          prerelease: false
